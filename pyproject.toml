[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trafego-bayesiano"
version = "0.3.0"
description = "Analisador quantitativo Bayesiano local para tráfego pago"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "openpyxl>=3.1",
  "streamlit>=1.40"
]

[project.scripts]
quant-trafego = "quant_trafego.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
