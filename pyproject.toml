[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trafego-bayesiano"
version = "0.9.0"
description = "Motor quantitativo Bayesiano local para tráfego pago"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<2.5",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "openpyxl>=3.1",
  "streamlit>=1.40,<2",
  "psutil>=5.9,<8",
  "duckdb>=1.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10"
]
deep = [
  "pymc>=6.2,<6.3",
  "arviz>=1.2,<2",
  "matplotlib>=3.8,<3.11"
]
optimization = [
  "botorch",
  "ax-platform",
  "mabwiser"
]
marketing = [
  "pymc-marketing"
]

[project.scripts]
quant-trafego = "quant_trafego.cli:main"
quant-trafego-mcmc = "quant_trafego.deep_cli:main"
quant-trafego-backtest = "quant_trafego.backtest_cli:main"
quant-trafego-compare-models = "quant_trafego.model_compare_cli:main"
quant-trafego-optimize = "quant_trafego.optimize_cli:main"
quant-trafego-portfolio = "quant_trafego.portfolio_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
