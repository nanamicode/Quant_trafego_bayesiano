name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip uv
      - run: uv lock --check
      - run: uv sync --python 3.12 --locked --extra dev
      - run: uv run --locked python -m compileall -q src
      - name: CLI smoke
        run: |
          uv run --locked quant-trafego --help >/dev/null
          uv run --locked quant-trafego-mcmc --help >/dev/null
          uv run --locked quant-trafego-backtest --help >/dev/null
          uv run --locked quant-trafego-compare-models --help >/dev/null
          uv run --locked quant-trafego-optimize --help >/dev/null
          uv run --locked quant-trafego-portfolio --help >/dev/null
      - run: uv run --locked pytest -q --ignore=tests/test_deep_smoke.py

  deep-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip uv
      - run: uv lock --check
      - run: uv sync --python 3.12 --locked --extra dev --extra deep
      - run: uv run --locked pytest -q tests/test_deep_smoke.py
