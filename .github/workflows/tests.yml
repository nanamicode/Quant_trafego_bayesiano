name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip uv
      - run: uv lock --python 3.12
      - name: Bootstrap lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- uv.lock; then
            echo "Lockfile already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: commit reproducible uv lockfile"
            git push
          fi
      - run: uv sync --python 3.12 --locked --extra dev
      - run: uv run --locked pytest -q
