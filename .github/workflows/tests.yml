name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip uv
      - run: uv lock --python 3.12
      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if [ -n "$(git status --porcelain -- uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: refresh uv lock for v0.7"
            git push
          fi
      - run: uv sync --python 3.12 --locked --extra dev --extra deep
      - run: uv run --locked pytest -q --ignore=tests/test_deep_smoke.py
      - run: uv run --locked pytest -q tests/test_deep_smoke.py
